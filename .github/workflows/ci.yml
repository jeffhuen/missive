name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features full -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --features full

  wasm:
    name: WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --features wasm
      - run: cargo check --target wasm32-unknown-unknown --no-default-features --features "wasm,resend,unsent,postmark,sendgrid,brevo,amazon_ses,mailtrap,mailjet,socketlabs,jmap,local"
      - name: Native-only feature diagnostics
        run: |
          set +e
          output=$(cargo check --target wasm32-unknown-unknown --no-default-features --features "wasm,smtp" 2>&1)
          rc=$?
          set -e
          test "$rc" -ne 0
          printf '%s\n' "$output" | grep -F "native-only on wasm32-unknown-unknown"
          ! printf '%s\n' "$output" | grep -F "unresolved module or unlinked crate"
      - name: Supported WASM providers avoid Tokio
        run: |
          tree=$(cargo tree --target wasm32-unknown-unknown --no-default-features --features "wasm,resend" --edges normal)
          ! printf '%s\n' "$tree" | grep -F "tokio v"

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ github.token }}
