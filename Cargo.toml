[package]
name = "missive"
version = "0.7.0"
edition = "2021"
description = "Compose, deliver, preview, and test emails in Rust - pluggable providers with zero configuration code"
license = "MIT"
repository = "https://github.com/jeffhuen/missive"
keywords = ["email", "smtp", "jmap", "ses", "resend"]
categories = ["email", "web-programming"]
exclude = [
  ".antigravitycli/**",
  ".beads/**",
  ".claude/**",
  ".agents/**",
  ".github/**",
  "AGENTS.md",
  "CLAUDE.md",
  "graphify-out/**",
]

[features]
default = []

# Target markers
wasm = []  # Explicit opt-in marker for wasm32 docs/CI; target-specific deps do the platform wiring

# Internal features (not for direct use)
_http = ["dep:reqwest", "_async_attachment_io"]  # Shared HTTP client for API-based providers
_aws_sig = ["dep:hmac", "dep:sha2", "dep:hex", "dep:urlencoding"]  # AWS Signature v4
_async_attachment_io = ["dep:tokio"]  # Async lazy attachment file reads for async providers

# Providers
smtp = ["dep:lettre", "_async_attachment_io"]
resend = ["_http"]
unsent = ["_http"]
postmark = ["_http"]
sendgrid = ["_http", "dep:flate2"]
brevo = ["_http"]
mailgun = ["_http"]
amazon_ses = ["_http", "_aws_sig"]
mailtrap = ["_http"]
mailjet = ["_http"]
socketlabs = ["_http"]
gmail = ["smtp", "_http"]  # Uses lettre for RFC 2822 + HTTP for Gmail API
protonbridge = ["smtp"]  # Thin wrapper around SMTP for local Proton Bridge
jmap = ["_http"]  # JMAP protocol for Stalwart, Fastmail, etc.

# Development & Testing
local = ["dep:regex"]  # LocalMailer + test assertions (regex for matching)
preview = ["local", "dep:tiny_http"]  # Standalone preview server (primary)
preview-axum = ["local", "dep:axum", "dep:tower-http"]  # Embed in Axum app
preview-actix = ["local", "dep:actix-web"]  # Embed in Actix app

# Observability
metrics = ["dep:metrics"]  # Prometheus-style counters/histograms

# Templating
templates = ["dep:askama"]

# Bundles
full = ["smtp", "resend", "unsent", "postmark", "sendgrid", "brevo", "mailgun", "amazon_ses", "mailtrap", "mailjet", "socketlabs", "gmail", "protonbridge", "jmap", "local", "templates", "preview-axum"]
dev = ["local", "preview"]

[dependencies]
# Core
async-trait = "0.1"  # Required for dyn Mailer compatibility (see src/mailer.rs)
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
mime_guess = "2"
base64 = "0.22"
email_address = "0.2"
idna = "1.0"

# Optional: Local mailer
regex = { version = "1", optional = true }

# Optional: Templating
askama = { version = "0.13", optional = true }

# Optional: Metrics
metrics = { version = "0.24", optional = true }

# Optional: AWS Signature v4 (for Amazon SES)
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
urlencoding = { version = "2", optional = true }

# Optional: Compression (for SendGrid)
flate2 = { version = "1.0", optional = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
actix-web = { version = "4", optional = true }
axum = { version = "0.8", optional = true }
chrono = { version = "0.4", features = ["serde"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder"], optional = true }
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"], optional = true }
tiny_http = { version = "0.12", optional = true }
tokio = { version = "1", default-features = false, features = ["fs", "rt"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
uuid = { version = "1", features = ["v4", "js"] }
web-time = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "0.6"
serde_urlencoded = "0.7"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
ureq = { version = "2", features = ["json"] }

[[example]]
name = "jmap_integration"
required-features = ["jmap"]

[[test]]
name = "adapters"
required-features = [
  "amazon_ses",
  "brevo",
  "gmail",
  "jmap",
  "local",
  "mailgun",
  "mailjet",
  "mailtrap",
  "postmark",
  "resend",
  "sendgrid",
  "socketlabs",
  "unsent",
]

[[test]]
name = "client_test"
required-features = ["local"]

[[test]]
name = "config_test"
required-features = ["full"]

[[test]]
name = "interceptor_test"
required-features = ["local"]

[[test]]
name = "memory_storage_test"
required-features = ["local"]

[[test]]
name = "preview_standalone_test"
required-features = ["preview"]

[[test]]
name = "preview_test"
required-features = ["preview-axum"]

[[test]]
name = "telemetry_test"
required-features = ["local"]

[[test]]
name = "test_assertions_test"
required-features = ["local"]
